<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard - CyberClinic</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h2>🏥 CyberClinic</h2>
            </div>
            <div class="nav-links">
                <span id="userName"></span>
                <a href="#" id="logoutBtn">Logout</a>
            </div>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="dashboard">
        <aside class="sidebar">
            <ul class="sidebar-menu">
                <li><a href="#" class="active" data-tab="appointments">My Appointments</a></li>
                <li><a href="#" data-tab="book">Book Appointment</a></li>
                <li><a href="#" data-tab="records">Medical Records</a></li>
                <li><a href="#" data-tab="profile">Profile</a></li>
                <li><a href="#" data-tab="find-doctor">Find a Doctor</a></li>
            </ul>
        </aside>

        <main class="dashboard-content">
            <!-- Appointments Tab -->
            <div id="appointments" class="tab-content active">
                <h2>My Appointments</h2>
                <div id="sharedNoteBanner" class="message"></div>
                <div class="filters">
                    <input type="text" id="searchAppointments" placeholder="Search appointments...">
                    <select id="filterStatus">
                        <option value="">All Status</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <div id="appointmentsList" class="appointments-list"></div>
            </div>

            <!-- Find a Doctor Tab (Reflected XSS demo) -->
            <div id="find-doctor" class="tab-content">
                <h2>Find a Doctor</h2>
                <div class="form-group">
                    <input type="text" id="doctorSearchInput" placeholder="Search doctors by name...">
                    <button id="doctorSearchBtn" class="btn btn-primary">Search</button>
                </div>
                <div id="doctorSearchResults"></div>
            </div>

            <!-- Book Appointment Tab -->
            <div id="book" class="tab-content">
                <h2>Book New Appointment</h2>
                <form id="bookAppointmentForm">
                    <div class="form-group">
                        <label for="doctorSelect">Select Doctor</label>
                        <select id="doctorSelect" name="doctor" required>
                            <option value="">Choose a doctor...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="appointmentDate">Date</label>
                        <input type="date" id="appointmentDate" name="date" required>
                    </div>
                    <div class="form-group">
                        <label for="appointmentTime">Time</label>
                        <select id="appointmentTime" name="time" required>
                            <option value="">Select time...</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reason">Reason for Visit</label>
                        <textarea id="reason" name="reason" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Book Appointment</button>
                </form>
                <div id="bookMessage" class="message"></div>
            </div>

            <!-- Medical Records Tab -->
            <div id="records" class="tab-content">
                <h2>Medical Records</h2>
                <div id="recordsList" class="records-list"></div>
                <hr>
                <h3>Download a Report</h3>
                <div class="form-group">
                    <input type="text" id="reportFileInput" value="sample-visit-summary.txt" placeholder="Report filename">
                    <button id="reportDownloadBtn" class="btn btn-primary">Download</button>
                </div>
                <pre id="reportDownloadResult"></pre>
            </div>

            <!-- Profile Tab -->
            <div id="profile" class="tab-content">
                <h2>My Profile</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profileName">Full Name</label>
                        <input type="text" id="profileName" name="fullName" required>
                    </div>
                    <div class="form-group">
                        <label for="profileEmail">Email</label>
                        <input type="email" id="profileEmail" name="email" required disabled>
                    </div>
                    <div class="form-group">
                        <label for="profilePhone">Phone Number</label>
                        <input type="tel" id="profilePhone" name="phone" required>
                    </div>
                    <div class="form-group">
                        <label for="profileAge">Age</label>
                        <input type="number" id="profileAge" name="age">
                    </div>
                    <div class="form-group">
                        <label for="profileGender">Gender</label>
                        <select id="profileGender" name="gender">
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
                <div id="profileMessage" class="message"></div>
            </div>
        </main>
    </div>

    <script src="js/patient.js"></script>
</body>
</html>
